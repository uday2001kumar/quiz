{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Signup</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'css/users/signup.css' %}">
</head>

<body>

<div class="container">

    <div class="header">
        <h2>Create Account</h2>
        <p>Join us and get started 🚀</p>
    </div>

    <form id="signupForm">
          {% csrf_token %}
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="full_name" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Mobile</label>
            <input type="text" id="mobile" placeholder="Enter mobile number" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" id="dob" required>
        </div>

        <button type="submit" class="btn">Create Account</button>

    </form>

    <div id="message"></div>

    <div class="login-link">
        <p>Already have an account?</p>
        <a href="/login/">Login</a>
    </div>

</div>

<script>
const BASE_URL = "{{ BASE_API_URL }}";

// get csrf token from cookie
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
        const cookies = document.cookie.split(";");
        for (let cookie of cookies) {
            cookie = cookie.trim();
            if (cookie.startsWith(name + "=")) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            }
        }
    }
    return cookieValue;
}

const csrftoken = getCookie("csrftoken");

document.getElementById("signupForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        full_name: document.getElementById("full_name").value,
        email: document.getElementById("email").value,
        mobile: document.getElementById("mobile").value,
        dob: document.getElementById("dob").value
    };

    localStorage.setItem("email", data.email);

    try {
        const response = await fetch(`${BASE_URL}/users/signup/`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrftoken   // ✅ important
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            document.getElementById("message").innerHTML = "✅ Signup successful!";
            window.location.href = "/verify-otp/";
        } else {
            document.getElementById("message").innerHTML = "❌ " + (result.message || "Error");
        }

    } catch (error) {
        document.getElementById("message").innerHTML = "⚠️ Server error!";
    }
});
</script>

</body>
</html>
