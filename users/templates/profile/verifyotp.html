{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Separate CSS -->
    <link rel="stylesheet" href="{% static 'css/users/verify_otp.css' %}">
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h2>Verify OTP</h2>
            <p>We sent a code to your email</p>
        </div>

        <form id="otpForm">

            <div class="otp-box">
                <input type="text" id="otp" maxlength="6" placeholder="Enter OTP" required>
            </div>

            <button type="submit" class="btn">Verify</button>

        </form>

        <div id="message"></div>

        <div class="resend">
            <p>Didn’t receive code?</p>
            <a href="#">Resend</a>
        </div>

    </div>

</div>

<script>
const BASE_URL = "{{ BASE_API_URL }}";

document.getElementById("otpForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const data = {
        email: localStorage.getItem("email"),
        otp: document.getElementById("otp").value
    };

    try {
        const response = await fetch(`${BASE_URL}/api/verify-otp/`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            document.getElementById("message").innerHTML = "✅ Verified Successfully!";
            setTimeout(() => {
                window.location.href = "/plans/";
            }, 1000);
        } else {
            document.getElementById("message").innerHTML = "❌ " + (result.error || "Invalid OTP");
        }

    } catch (error) {
        document.getElementById("message").innerHTML = "⚠️ Server error!";
    }
});
</script>

</body>
</html>
