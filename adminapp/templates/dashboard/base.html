{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Admin{% endblock %}</title>

<link rel="stylesheet" href="{% static 'css/admin/dashboard.css' %}">
{% block extra_css %}{% endblock %}
</head>

<body>

<div class="dashboard">

    <!-- 🔥 ONLY SIDEBAR -->
    <div class="sidebar">
        <h2>Quiz Admin</h2>

        <ul>
            <li><a href="/adminapp/dashboard/">Dashboard</a></li>
            <li>Users</li>
            <li>Quizzes</li>
            <li><a href="/adminapp/subscriptions/">Subscriptions</a></li>
            <li>Reports</li>
            <li onclick="logout()" style="cursor:pointer;">Logout</li>
        </ul>
    </div>

    <!-- 🔥 PAGE CONTENT -->
    <div class="main">
        {% block content %}
        {% endblock %}
    </div>

</div>

<script>
function logout() {
    localStorage.clear();
    window.location.href = "/auth/admin-login/";
}
</script>

{% block scripts %}{% endblock %}

</body>
</html>
